name: ETL streaming (sekali jalan, manual)

on:
  workflow_dispatch:

concurrency:
  group: etl-loop               # antre bersama loop otomatis
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Extract GBFS -> Transform (Python) -> Load Supabase
        run: python -m etl.run_etl stream
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
